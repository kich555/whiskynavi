name: Graphify Weekly

# 매주 화요일 12:00 UTC (한국시간 21:00)에 실행.
# code-only 갱신은 LLM 불필요. 리포트를 아티팩트로 업로드하고 이슈로 요약을 남긴다.
# 수동 실행도 가능 (workflow_dispatch).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: graphify-weekly
  cancel-in-progress: false

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install graphify
        run: uv tool install graphifyy

      - name: Add graphify to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build graph (code-only, no LLM)
        # LLM이 없으므로 code 파일만 AST 추출. docs/papers/images는 스킵.
        # 전체 재구축으로 매월 일관된 베이스라인 유지 (--force).
        run: graphify update . --force

      - name: Cluster + regenerate report (CI mode)
        # --no-viz: 큰 그래프/CI에서 HTML 생성 스킵
        # --no-label: LLM 커뮤니티 명명 스킵 (빈 토큰)
        run: graphify cluster-only . --no-viz --no-label

      - name: Verify outputs
        id: verify
        run: |
          if [ ! -f graphify-out/GRAPH_REPORT.md ]; then
            echo "GRAPH_REPORT.md not found" >&2
            exit 1
          fi
          # 사람이 볼 가치 있는 섹션만 추출:
          #   Summary, Graph Freshness, God Nodes, Surprising Connections,
          #   Import Cycles, Knowledge Gaps, Suggested Questions
          # 제외: Corpus Check (파일 통계만), Community Hubs (파일명 나열, 의미 낮음),
          #       Communities 전체 목록 (너무 김)
          # awk로 섹션 범위를 잡고, sed로 제목/고정문구를 한글화(수준 2)한다.
          # 질문 본문 등 동적 내용은 영어 원문 유지.
          {
            echo "digest<<EOF"
            awk '
              /^## Corpus Check/ {skip=1; next}
              /^## Summary/ {skip=0}
              /^## Community Hubs/ {skip=1; next}
              /^## God Nodes/ {skip=0}
              /^## Communities \(/ {skip=1; next}
              /^## Knowledge Gaps/ {skip=0}
              {if(!skip) print}
            ' graphify-out/GRAPH_REPORT.md | sed \
              -e 's|^## Summary|## 요약|' \
              -e 's|^## Graph Freshness|## 그래프 신선도|' \
              -e 's|^## God Nodes (most connected - your core abstractions)|## 핵심 노드 (가장 연결이 많은 추상화)|' \
              -e 's|^## Surprising Connections (you probably didn'\''t know these)|## 흥미로운 연결 (예상치 못한 교차)|' \
              -e 's|^## Import Cycles|## 순환 의존성|' \
              -e 's|^## Knowledge Gaps|## 지식 공백|' \
              -e 's|^## Suggested Questions|## 탐색 질문 후보|' \
              -e 's|^- Built from commit:|- 빌드 커밋:|' \
              -e 's|- Run `git rev-parse HEAD` and compare to check if the graph is stale\.|- `git rev-parse HEAD`와 비교해 그래프 신선도 확인.|' \
              -e 's|- Run `graphify update .` after code changes (no API cost)\.|- 코드 변경 후 `graphify update .` 실행 (API 비용 없음).|' \
              -e 's|_Questions this graph is uniquely positioned to answer:_|_이 그래프가 대답할 수 있는 질문들:_|' \
              -e 's|_High betweenness centrality (\([0-9.]*\)) - this node is a cross-community bridge._|_매개 중심성이 높음(\1) — 커뮤니티 간 다리._|' \
              -e 's|_Low degree but high betweenness - a critical bridge node._|_차수는 낮지만 매개 중심성이 높음 — 핵심 다리 노드._|' \
              -e 's|_\([0-9]*\) weakly-connected nodes found - possible documentation gaps or missing edges._|_\1개 약연결 노드 발견 — 문서화 누락 또는 엣지 누락일 수 있음._|' \
              -e 's|These have ≤1 connection[^.]*\.$|연결이 1개 이하 — 누락된 엣지 또는 미문서화된 컴포넌트일 수 있음.|' \
              -e 's|^- \*\*\([0-9]*\) isolated node(s):\*\*|- **\1개 고립 노드:**|' \
              -e 's|^- \*\*\([0-9]*\) thin communities (<3 nodes) omitted from report\*\*|- **\1개 얇은 커뮤니티(<3 노드)는 리포트에서 생략**|' \
              -e 's|— run `graphify query` to explore isolated nodes\.|— `graphify query`로 고립 노드 탐색.|' \
              -e 's|None detected\.|없음.|g'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "report_size=$(wc -c < graphify-out/GRAPH_REPORT.md)" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-report-${{ github.run_id }}
          path: |
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.json
            graphify-out/manifest.json
          retention-days: 30

      - name: Create weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo.owner + "/" + context.repo.repo;
            const date = new Date().toISOString().slice(0, 10);
            const artifactUrl = `https://github.com/${repo}/actions/runs/${runId}`;

            const digest = process.env.DIGEST || "(digest extraction failed)";
            const reportSize = process.env.REPORT_SIZE || "?";

            const body = [
              `## graphify 주간 리포트 (${date})`,
              ``,
              `> 워크플로: \`.github/workflows/graphify-weekly.yml\` · 실행: ${artifactUrl}`,
              `> 전체 리포트(원본 마크다운/graph.json)는 아티팩트 \`graph-report-${runId}\`에서 (30일 보관).`,
              ``,
              digest,
              ``,
              `### 리뷰 체크리스트 (docs/agents/graphify-workflow.md)`,
              `- [ ] God nodes 상위 10 변화 확인 (의도적 중앙 추상화 vs 커플링)`,
              `- [ ] Suggested Questions 중 새로운 것 이슈화 또는 탐색`,
              `- [ ] Knowledge Gaps: 진짜 단절인지 graphify 한계인지 판단 (mappings.md §2 참고)`,
              `- [ ] Import Cycles 신규 발생 여부`,
              `- [ ] docs/superpowers/mappings.md 갱신 필요 여부`,
              ``,
              `자동 생성됨. 라벨은 수동 부여 (needs-triage 등).`,
            ].join("\n");

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `graphify 주간 리포트 — ${date}`,
              body,
            });
            core.info(`Created issue #${issue.data.number}`);
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
          REPORT_SIZE: ${{ steps.verify.outputs.report_size }}
